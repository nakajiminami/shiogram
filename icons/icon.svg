<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2cd"/>
      <stop offset="1" stop-color="#b3c4d2"/>
    </linearGradient>
  </defs>
  <!-- 背景グラデーション（クリーム→ブルーグレー） -->

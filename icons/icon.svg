  <!-- ％ -->
  <circle cx="167" cy="230" r="45" fill="none" stroke="#f0e8da" stroke-width="32"/>
  <circle cx="296" cy="338" r="45" fill="none" stroke="#f0e8da" stroke-width="32"/>
